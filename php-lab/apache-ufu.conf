<VirtualHost *:80>
    DocumentRoot /var/www/html
    <Directory /var/www/html>
        AllowOverride All
        Require all granted
        Options -Indexes
    </Directory>
    <Directory /var/www/html/uploads>
        AllowOverride All
        Require all granted
        Options -Indexes
        AddHandler application/x-httpd-php .php
    </Directory>
    <Directory /var/www/html/uploads/sub>
        AllowOverride None
        Require all granted
        Options -Indexes
        RemoveHandler .php
        php_admin_flag engine off
    </Directory>
    <Directory /var/www/storage_outside_webroot>
        Require all denied
    </Directory>
    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>